<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/02280d45a5.js"
      crossorigin="anonymous"
    ></script>
    <title>Login Page</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}"
    />

    <style></style>
  </head>
  <body>
    <div class="page-container">
      <!-- LEFT SIDE: BRAND & HERO SHOWCASE -->
      <div class="brand-side">
        <div class="brand-content">
          <div class="logo-box">
            <i class="fa-solid fa-boxes-stacked"></i>
            <span>SIMS</span>
          </div>

          <div class="hero-text">
            <h1>Stock & Inventory<br />Management System</h1>
          </div>

          <div class="feature-pills">
            <div class="pill">
              <i class="fa-solid fa-chart-line"></i> Live Analytics
            </div>
            <div class="pill">
              <i class="fa-solid fa-truck-fast"></i> Order Tracking
            </div>
            <div class="pill">
              <i class="fa-solid fa-shield-halved"></i> Secure Access
            </div>
          </div>
        </div>

        <!-- Decorative background accent shapes -->
        <div class="circle-shape shape-1"></div>
        <div class="circle-shape shape-2"></div>
      </div>

      <!-- RIGHT SIDE: FORM CONTAINER (Includes all original IDs for JS/Flask) -->
      <div class="login-container">
        <div class="form-header">
          <h2>Welcome Back</h2>
          <span>Please enter your details to sign in</span>
        </div>

        <form action="#" id="form">
          <div class="input">
            <div class="field-wrapper">
              <label for="user">Username or Email</label>
              <input
                id="user"
                type="text"
                placeholder="Enter your username or email"
              />
            </div>

            <div class="field-wrapper">
              <label for="password">Password</label>
              <div class="password">
                <input
                  type="password"
                  id="password"
                  placeholder="Enter your password"
                />
                <i id="eye" class="fa-regular fa-eye"></i>
              </div>
            </div>
          </div>

          <div class="checkbox">
            <input type="checkbox" id="rememberMe" />
            <label for="rememberMe">Remember me</label>
          </div>

          <button type="submit">Submit</button>

          <!-- Message container kept intact for JS error handling -->
          <p id="errorMessage"></p>

          <p class="signup-link">
            Don't have an account? <a href="/signup">Create One</a>
          </p>
        </form>
      </div>
    </div>

    <script>
      let form = document.getElementById("form");
      let eye = document.getElementById("eye");
      let password = document.getElementById("password");
      let user = document.getElementById("user");
      let errorMessage = document.getElementById("errorMessage");

      // show/hide
      eye.addEventListener("click", () => {
        if (password.type === "password") {
          password.type = "text";
          eye.classList.remove("fa-eye");
          eye.classList.add("fa-eye-slash");
        } else {
          password.type = "password";
          eye.classList.remove("fa-eye-slash");
          eye.classList.add("fa-eye");
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorMessage.innerText = "";

        if (user.value.trim() === "" || password.value.trim() === "") {
          errorMessage.innerHTML = "Invalid username/password";
          return;
        }

        if (user.value.includes("@") && !user.value.includes(".")) {
          errorMessage.innerHTML = "invalid email";
          return;
        }

        // authentication
        let loginData = {
          username: user.value,
          password: password.value,
        };

        // sends request to flask
        let response = await fetch("/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(loginData),
        });

        let data = await response.json();

        if (data.success) {
          errorMessage.style.color = "green";
          errorMessage.innerHTML = data.message;
          form.reset();

          window.location.href = "/dashboard";
        } else {
          errorMessage.style.color = "red";
          errorMessage.innerHTML = data.message;
        }
      });
    </script>
  </body>
</html>
